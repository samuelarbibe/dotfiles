# Outer "chrome" server started by `ws`: a sidebar pane next to one pane
# attached to the real tmux server. It has no prefix and no status line, so
# every key reaches the inner tmux untouched.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:hyperlinks:clipboard"
set -as terminal-features ",xterm-256color:RGB:extkeys:hyperlinks:clipboard"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on
set -g escape-time 0
set -g set-clipboard on
set -g allow-passthrough on
set -g mouse on
set -g status off
set -g prefix None
set -g prefix2 None
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# herdr draws the sidebar separator in the background colour: invisible.
set -g pane-border-style "fg=#282c34"
set -g pane-active-border-style "fg=#282c34"
set -g pane-border-lines single

# Clicks on the sidebar go to it without stealing keyboard focus.
bind -n MouseDown1Pane if -F "#{==:#{pane_id},#{@sidebar}}" \
  "send-keys -M -t =" "select-pane -t = ; send-keys -M -t ="
bind -n MouseDown3Pane if -F "#{==:#{pane_id},#{@sidebar}}" \
  "send-keys -M -t =" "select-pane -t = ; send-keys -M -t ="

# Closing the Ghostty tab or detaching the inner client tears the chrome down;
# the real tmux server and its sessions keep running.
set-hook -g client-detached kill-server
set-hook -g pane-exited kill-server

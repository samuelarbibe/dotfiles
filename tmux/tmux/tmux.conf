# tmux, set up to feel like herdr. Launch with `ws` for the sidebar.
# Colours are herdr's One Dark tokens (src/app/state.rs one_dark()).

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:hyperlinks:clipboard"
set -as terminal-features ",xterm-256color:RGB:extkeys:hyperlinks:clipboard"
set -as terminal-features ",tmux-256color:RGB:extkeys:hyperlinks:clipboard"
# pi warns about modified Enter keys without these.
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on
set -g escape-time 10
set -g set-clipboard on
set -g allow-passthrough on
set -g history-limit 50000
set -g mouse on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "#h: #S"

# --- Keys: herdr defaults (prefix C-b) --------------------------------------
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab select-pane -t :.+
bind BTab select-pane -t :.-
bind x kill-pane
bind c command-prompt -p "tab name:" "new-window -c '#{pane_current_path}' -n '%%'"
bind T command-prompt -I "#W" -p "rename tab:" "rename-window '%%'"
bind X kill-window
bind N command-prompt -p "new space:" "new-session -d -s '%%' -c '#{pane_current_path}' ; switch-client -t '=%%'"
bind W command-prompt -I "#S" -p "rename space:" "rename-session '%%'"
bind D confirm-before -p "close space #S? (y/n)" kill-session
bind P command-prompt -p "rename pane:" "set -p @pane_name '%%'"
bind w choose-tree -Zs -O name -F "#{?pane_format,#{?#{@agent},#{@agent_state} · ,}#{pane_title},#{?window_format,#{window_name},#{session_windows} tabs}}"
bind s choose-tree -Zs -O name
bind q detach-client
bind R source-file ~/.config/tmux/tmux.conf \; display "config reloaded"
bind b run-shell "~/.config/tmux/bin/ws sidebar-toggle '#{client_tty}'"
bind o run-shell "~/.config/tmux/bin/ws jump '#{client_tty}'"
bind n run-shell -b "python3 ~/.config/tmux/bin/tasks.py popup --client #{q:client_tty} --dir #{q:pane_current_path}"
bind e run-shell "tmux capture-pane -pJS - -t '#{pane_id}' > /tmp/tmux-scrollback.txt; tmux display-popup -E -w 90% -h 90% 'nvim + /tmp/tmux-scrollback.txt'"

bind r switch-client -T resize
bind -T resize h resize-pane -L 3 \; switch-client -T resize
bind -T resize j resize-pane -D 2 \; switch-client -T resize
bind -T resize k resize-pane -U 2 \; switch-client -T resize
bind -T resize l resize-pane -R 3 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root

bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},newtab}" \
  "new-window -c '#{pane_current_path}'" "select-window -t ="

# --- Tab bar (top), like herdr's -------------------------------------------
set -g status-position top
set -g status-style "bg=default,fg=#abb2bf"
set -g status-left ""
set -g status-right ""
set -g window-status-format "#[fg=#737a87,bg=#2c313a]  #W#{?#{@ws_tab_dot}, #{E:@ws_tab_dot},}  #[default]"
set -g window-status-current-format "#[fg=#282c34,bg=#61afef,bold]  #W  #[default]"
set -g window-status-separator " "
set -g status-format[0] "#[align=left]#{W:#[range=window|#{window_index}]#{E:window-status-format}#[norange default]#{window-status-separator},#[range=window|#{window_index}]#{E:window-status-current-format}#[norange default]#{window-status-separator}}#[range=user|newtab]#[fg=#737a87] + #[norange default]#[align=right]#{E:status-right}"

# Dot on background tabs when an agent inside wants attention.
set -g @ws_tab_dot "#{?#{m:*blocked*,#{P:#{@agent_state} }},#[fg=#e06c75]●,#{?#{m:*done*,#{P:#{@agent_state} }},#[fg=#56b6c2]●,#{?#{m:*working*,#{P:#{@agent_state} }},#[fg=#e5c07b]●,}}}"

# --- Pane frames: drawn only when a tab is split (herdr pane_borders=auto) --
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-style "fg=#5c6370"
set -g pane-active-border-style "fg=#61afef"
set -g pane-border-format "#{?#{@pane_name},#[bold] #{@pane_name} ,#{?#{@agent},#[bold] #{@agent} ,}}"
set -g pane-border-status off
set-hook -g window-layout-changed \
  'if -F "#{==:#{window_panes},1}" "set -w pane-border-status off" "set -w pane-border-status top"'
set -g pane-scrollbars modal
set -g pane-scrollbars-style "bg=#2c313a,fg=#5c6370"

set -g message-style "bg=#2c313a,fg=#e5c07b"
set -g message-command-style "bg=#2c313a,fg=#e5c07b"
set -g mode-style "bg=#334659,fg=#abb2bf"
set -g popup-border-style "fg=#61afef"
set -g popup-border-lines rounded
set -g menu-style "bg=#282c34,fg=#abb2bf"
set -g menu-selected-style "bg=#313640,fg=#61afef"
set -g menu-border-style "fg=#5c6370"
set -g clock-mode-colour "#61afef"

# herdr "done" means finished and not looked at yet: clear it once you look.
set-hook -g pane-focus-in 'if -F "#{==:#{@agent_state},done}" "set -p @agent_state idle"'
set-hook -g session-window-changed 'if -F "#{==:#{@agent_state},done}" "set -p @agent_state idle"'
set-hook -g client-session-changed 'if -F "#{==:#{@agent_state},done}" "set -p @agent_state idle"'

# --- Persistence: resurrect + continuum, and pi sessions come back ---------
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Own dir: ~/.local/share/tmux/resurrect holds stale July saves that would auto-restore.
set -g @resurrect-dir '~/.local/share/tmux/ws-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-hook-post-save-all '~/.config/tmux/bin/ws pi-save'
set -g @resurrect-hook-post-restore-all '~/.config/tmux/bin/ws pi-restore'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

run '~/.tmux/plugins/tpm/tpm'
